<html>
    <body style="
        padding: 0;
        margin: 0;
    ">
        <iframe id="game" scrolling="no" style="
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            position: absolute;
            border: 0;
        "></iframe>
        
        <button id="sound" style="position: absolute; bottom: 0; right: 0;">Sound</button>
        <button id="captions" style="position: absolute; bottom: 0; right: 5em;">Captions</button>
        <button id="vo" style="position: absolute; bottom: 0; right: 10em;">VO</button>
        <button id="music" style="position: absolute; bottom: 0; right: 15em;">Music</button>
        <button id="sfx" style="position: absolute; bottom: 0; right: 20em;">SFX</button>
        <button id="pause" style="position: absolute; bottom: 0; right: 25em;">Pause</button>
        <button id="help" style="position: absolute; bottom: 0; right: 30em;">Help</button>

        <script type="text/javascript" src="../node_modules/bellhop-iframe/dist/bellhop-umd.js"></script>
        <script type="text/javascript" src="../node_modules/springroll-container/dist/SpringRoll-Container-umd.js"></script>
        <script>
            const
                {UserDataPlugin, CaptionsTogglePlugin, Container, HelpPlugin, PausePlugin, SoundPlugin} = springroll,
                container = new Container("#game", {
                    plugins: [
                        new UserDataPlugin(),    
                        new CaptionsTogglePlugin('#captions'),
                        new HelpPlugin('#help'),
                        new PausePlugin('#pause'),
                        new SoundPlugin({
                            soundButtons: '#sound', // mutes or unmutes all game audio
                            musicButtons: '#music', // mutes or unmutes the music
                            voButtons: '#vo', // mutes or unmutes the voice over
                            sfxButtons: '#sfx', // mutes or unmutes the game's sound effects

                            // The sound button expects these to be HTML range inputs
                            //soundSliders: '#soundSlider', // controls the game's audio volume
                            //musicSliders: '#musicSlider', // controls the game's music volume
                            //voSliders: '#voSlider', // controls the game's voice-over volume
                            //sfxSliders: '#sfxSlider', // controls the game's sound effects volume
                        }),
                    ]
                });
                
            container.openPath("../deploy/index.html");
        </script>
    </body>
</html>
